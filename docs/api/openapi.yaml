    Lighting:
      type: object
      properties:
        detected:
          allOf:
          - $ref: '#/components/schemas/LightingMethodEnum'
          description: 'dark: the photograph is under-exposed or a dark scene (the dark-photo method may brighten it); light:
            normal, over-exposed or back-lit (with the server''s back-lit switch on, AI Enhance lifts the shadows of a back-lit
            subject: `brightened` is then true while this stays light).


            * `dark` - dark

            * `light` - light'
        exposure:
          type: string
          description: 'The analyzer''s own status: low_light, low_light_subject, dark_scene, backlit_subject, normal or overexposed.'
        scene_median:
          type: number
          format: double
          nullable: true
          description: Median grey level of the frame, 0 (black) to 255.
        brightened:
          type: boolean
          description: Whether a brightening step really changed the photograph. A dark photograph can be detected dark and
            still not be brightened when the brightening was not safe to apply.
        used:
          allOf:
          - $ref: '#/components/schemas/LightingMethodEnum'
          description: 'The method the engine followed: the person''s own choice when `forced`, else what it detected. Whether
            the dark-photo method actually changed the photograph is `brightened`: a forced `dark` whose lift was refused
            reads used `dark`, brightened false, and `enhancement_summary` says nothing was changed.


            * `dark` - dark

            * `light` - light'
        forced:
          type: boolean
          description: True when the person chose Dark photo or Light photo (the request's `lighting`) and the engine followed
            it; false for `auto` and for results made before the choice existed.
      required:
      - brightened
      - detected
      - exposure
      - forced
      - scene_median
      - used
