openapi: 3.0.3
info:
  title: FaceCloud API
  version: dev
  description: "FaceCloud AI: authenticated facial-image upload, enhancement, validation, identity grouping, reports, sharing\
    \ and downloads.\n\n## Quick start (the enhancement flow)\n\n1. `POST /api/auth/register/` then `POST /api/auth/verify-email/`\
    \ (six-digit code), then `POST /api/auth/login/`. Send the returned\n   `access` token as `Authorization: Bearer <access>`\
    \ on every other call (in Swagger UI, press the **Authorize** button and paste the access token). Refresh it with `POST\
    \ /api/auth/refresh/`.\n2. `POST /api/images/upload/single/` (multipart field `file`). The response is an **upload batch**;\
    \ the image is `images[0]`.\n3. `POST /api/enhancements/images/{image_id}/` with `{\"level\": \"auto\", \"style\": \"\
    natural\"}`. Returns **202** and a result with `status: \"queued\"`.\n4. Poll `GET /api/enhancements/results/{id}/` until\
    \ `status` is `completed` (or `failed`).\n   `enhancement_outcome` says what happened (`enhanced`, `partially_enhanced`,\
    \ `original_preserved`, `failed`) and `enhancement_summary` is one plain sentence safe to show a user.\n5. `GET /api/enhancements/results/{id}/download/`\
    \ returns the one final image.\n\n## Conventions\n\n* **Errors.** Validation errors (400) are `{\"field\": [\"message\"\
    ]}`; every other error is `{\"detail\": \"...\", \"code\": \"...\"}` (see the `ErrorDetail` schema).\n  401 means a missing,\
    \ expired or revoked token; 403 not allowed; 404 not found *or not yours* (other users' data is never revealed); 429 a\
    \ rate limit.\n* **Ownership.** Every call acts on the caller's own data unless the endpoint says it is for administrators\
    \ or organization roles.\n* **Pagination.** List endpoints return a plain array, or a paginated object when `page` or\
    \ `page_size` is passed.\n* **Asynchronous work.** Enhancement, reports, exports and packages are queued jobs: the POST\
    \ returns 202 and you poll the resource.\n* **Images.** Downloads stream through the API after an ownership check; there\
    \ are no public file URLs (shares use revocable tokens).\n* **Identity.** `identity_status` and `identity_verification.state`\
    \ say whether faces were compared with the upload. They never claim a guarantee.\n"
  contact:
    name: FaceCloud backend
paths:
  /api/auth/invitations/accept/:
    post:
      operationId: auth_invitations_accept_create
      description: 'Public: creates the invited account and signs in.


        **Access:** public, no token needed. **Rate limit:** `invitation` scope, 30/hour (429 when exceeded).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAccept'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationAccept'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationAccept'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Accept an invitation
  /api/auth/invitations/inspect/:
    post:
      operationId: auth_invitations_inspect_create
      description: 'Public: what an invitation token is for (role, email), so the sign-up form can show it.


        **Access:** public, no token needed. **Rate limit:** `invitation` scope, 30/hour (429 when exceeded).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationToken'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Inspect an invitation
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: 'Send exactly one of `identifier`, `username` or `email`, plus `password`. Returns `{refresh, access, user,
        role, dashboard}`. Repeated failures lock the account for a growing delay.


        **Access:** any signed-in user, on their own data (another user''s data is a 404). **Rate limit:** `login` scope,
        20/hour (429 when exceeded).'
      summary: Log in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceCloudTokenObtainPair'
            examples:
              typical:
                summary: Typical request
                value:
                  identifier: amina@example.com
                  password: ForestRiver!4821
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FaceCloudTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FaceCloudTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                typical:
                  summary: Typical response
                  value:
                    refresh: <refresh token>
                    access: <access token>
                    role: user
                    user:
                      id: 7
                      username: amina
                      email: amina@example.com
                      role: user
                      is_email_verified: true
                    dashboard: user
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                WrongCredentials,Unverified,SuspendedOrInactiveAccount:
                  value:
                    detail:
                    - Invalid username/email or password.
                  summary: Wrong credentials, unverified, suspended or inactive account
          description: ''
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Request a password reset
      description: 'Sends a reset link to the address when it belongs to an account.


        **Access:** public, no token needed. **Rate limit:** `password_reset` scope, 10/hour (429 when exceeded).'
  /api/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Set a new password from a reset link
      description: 'Send `uidb64` and `token` from the emailed link and `new_password`. Existing tokens are revoked, so sign
        in again.


        **Access:** public, no token needed. **Rate limit:** `password_reset` scope, 10/hour (429 when exceeded).'
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: 'Takes the `refresh` token and returns a new `access` token (and a rotated `refresh` when rotation is on).
        Revoked or signed-out sessions are refused.


        **Access:** any signed-in user, on their own data (another user''s data is a 404). **Rate limit:** `token_refresh`
        scope, 60/hour (429 when exceeded).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceCloudTokenRefresh'
            examples:
              typical:
                summary: Typical request
                value:
                  refresh: <refresh token>
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FaceCloudTokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FaceCloudTokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceCloudTokenRefresh'
              examples:
                typical:
                  summary: Typical response
                  value:
                    access: <new access token>
                    refresh: <rotated refresh token>
          description: ''
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Refresh the access token
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: 'Creates a *pending* registration and emails a six-digit code. The account exists only after `POST /api/auth/verify-email/`
        succeeds. Returns 202 with `registration_id`, a masked email and the code lifetime. An active registration for the
        same username or email gives 400.


        **Access:** public, no token needed. **Rate limit:** `registration` scope, 10/hour (429 when exceeded).'
      summary: Start a registration
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
            examples:
              typical:
                summary: Typical request
                value:
                  username: amina
                  email: amina@example.com
                  password: ForestRiver!4821
                  password_confirm: ForestRiver!4821
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                typical:
                  summary: Typical response
                  value:
                    registration_id: 0b6f1c1e-6a4e-4b0e-9b6e-3f2a5d1c7e90
                    email: a***a@example.com
                    detail: A six-digit verification code has been sent.
                    expires_in_seconds: 900
                    resend_available_in_seconds: 60
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                EmailAlreadyUsed:
                  value:
                    email:
                    - A user with this email already exists.
                  summary: Email already used
          description: ''
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/auth/registrations/{registration_id}/status/:
    get:
      operationId: auth_registrations_status_retrieve
      description: 'Masked status of a pending registration (no secrets): whether it is waiting for a code, expired or complete.


        **Access:** public, no token needed. **Rate limit:** `verification_status` scope, 60/hour (429 when exceeded).'
      summary: Check a registration in progress
      parameters:
      - in: path
        name: registration_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: 'Send `registration_id` and the six-digit `code`. On success the account is created (201). Wrong codes
        are counted.


        **Access:** public, no token needed. **Rate limit:** `verification` scope, 10/hour (429 when exceeded).'
      summary: Verify the emailed code and create the account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRegistration'
            examples:
              typical:
                summary: Typical request
                value:
                  registration_id: 0b6f1c1e-6a4e-4b0e-9b6e-3f2a5d1c7e90
                  code: '482913'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyRegistration'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/auth/verify-email/change/{uidb64}/{token}/:
    get:
      operationId: auth_verify_email_change_retrieve
      summary: Confirm an email-address change
      parameters:
      - in: path
        name: token
        schema:
          type: string
        description: Signed verification token from the verification email.
        required: true
      - in: path
        name: uidb64
        schema:
          type: string
        description: URL-safe base64 user id from the verification email.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      description: 'Opened from the link emailed to the new address; confirms the change.


        **Access:** public, no token needed. **Rate limit:** `verification` scope, 10/hour (429 when exceeded).'
  /api/auth/verify-email/resend/:
    post:
      operationId: auth_verify_email_resend_create
      description: 'Invalidates the current code and sends a new one to the same address, subject to a cooldown and a resend
        limit (429 when exceeded).


        **Access:** public, no token needed. **Rate limit:** `verification` scope, 10/hour (429 when exceeded).'
      summary: Resend the verification code
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendVerification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendVerification'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/camera/sessions/:
    get:
      operationId: camera_sessions_list
      description: 'The user''s camera sessions from the last 30 days.


        **Access:** any signed-in user, on their own data (another user''s data is a 404).'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - camera
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCameraSessionList'
          description: ''
        '401':
          description: Missing, expired, revoked or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: List camera sessions
    post:
      operationId: camera_sessions_create
      description: 'The user''s camera sessions from the last 30 days; POST starts one.


        A session records only metadata. No video is ever sent or stored.


        **Access:** any signed-in user, on their own data (another user''s data is a 404).'
      tags:
      - camera
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraSession'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CameraSession'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CameraSession'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraSession'
          description: ''
        '401':
          description: Missing, expired, revoked or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Start a camera session
  /api/camera/sessions/{session_id}/:
    get:
      operationId: camera_sessions_retrieve
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - camera
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraSessionDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          description: Missing, expired, revoked or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Get a camera session
      description: '**Access:** any signed-in user, on their own data (another user''s data is a 404).'
  /api/camera/sessions/{session_id}/end/:
    post:
      operationId: camera_sessions_end_create
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - camera
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraSession'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          description: Missing, expired, revoked or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: End a camera session
      description: '**Access:** any signed-in user, on their own data (another user''s data is a 404).'
  /api/camera/sessions/{session_id}/snapshots/:
    post:
      operationId: camera_sessions_snapshots_create
      description: 'Save one snapshot the user chose to take (an explicit action; nothing is stored automatically).


        **Access:** any signed-in user, on their own data (another user''s data is a 404). **Rate limit:** `image_upload`
        scope, 100/hour (429 when exceeded).'
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - camera
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          description: Missing, expired, revoked or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Save a snapshot
  /api/contact/:
    post:
      operationId: contact_create
      description: 'Public contact form. 202 means accepted for delivery, not yet delivered.


        **Access:** public, no token needed. **Rate limit:** `contact` scope, 5/hour (429 when exceeded).'
      tags:
      - contact
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMessage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContactMessage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContactMessage'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactAccepted'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
      summary: Send a contact message
  /api/downloads/:
    get:
      operationId: downloads_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - downloads
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDownloadEventList'
          description: ''
        '401':
          description: Missing, expired, revoked or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: List download packages and reports
      description: '**Access:** any signed-in user, on their own data (another user''s data is a 404).'
