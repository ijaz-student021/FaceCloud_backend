  /api/enhancements/images/{image_id}/:
    post:
      operationId: enhancements_images_create
      description: 'Queues an enhancement of one image and returns **202** with a result (`status: queued`). `level` is `auto`
        (recommended), `low`, `medium` or `high`; `style` is `natural`, `dynamic` or `ai_max` (AI Enhance); or send a `preset`
        (`auto`, `standard` or `pro`), a name for one level + style pair that fills in whichever of the two is not sent (a
        `level` or `style` that is sent wins). With the adaptive engine on, one input yields **one** output: only the models
        the photograph''s defects call for run, every result is validated, and the original is returned when nothing safe
        was found. 409 if this image already has an enhancement queued or running; 429 when the user''s job limit is reached.


        **Access:** any signed-in user, on their own data (another user''s data is a 404).'
      summary: Enhance an image
      parameters:
      - in: path
        name: image_id
        schema:
          type: integer
        required: true
      tags:
      - enhancements
      requestBody:
        content:
          application/json:
            schema:
