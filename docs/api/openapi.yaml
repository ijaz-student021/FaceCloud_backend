      properties:
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          default: auto
        adjustments:
          allOf:
          - $ref: '#/components/schemas/GalleryAdjustment'
          description: Used in manual mode only. Omitted or empty means neutral (the edit changes nothing).
        intent:
          allOf:
          - $ref: '#/components/schemas/IntentEnum'
          default: auto
          description: 'Auto mode only. auto: fix clear technical faults only (never lifts or darkens overall exposure); brighten:
            also lift a dark photo; preserve: leave tonality alone.


            * `auto` - auto

            * `preserve` - preserve

            * `brighten` - brighten'
        source_version:
          type: string
          description: The source_version this request was made against; a 409 stale_source if it is no longer current.
          maxLength: 32
        revision:
          type: integer
          maximum: 2147483647
          minimum: 1
          description: Chosen by the client, increasing with every change it wants to see. The highest revision is the latest;
            an answer to an older one is stored but reported with is_latest false, and never replaces a newer preview. Repeating
            a revision with the same settings returns the stored preview; with different settings it is a 409.
        size:
          type: integer
          maximum: 65535
          minimum: 1
          description: Longer edge in pixels (default and maximum are in the editor configuration).
      required:
      - revision
