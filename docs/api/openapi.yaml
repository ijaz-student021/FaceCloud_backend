components:
  schemas:
    AccountInvitation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/AccountInvitationRoleEnum'
        status:
          type: string
          readOnly: true
        invited_by:
          type: string
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        accepted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - accepted_at
      - created_at
      - email
      - expires_at
      - id
      - invited_by
      - role
      - status
    AccountInvitationRoleEnum:
      enum:
      - user
      - moderator
      - admin
      type: string
      description: '* `user` - user

        * `moderator` - moderator

        * `admin` - admin'
    Acknowledge:
      type: object
      properties:
        note:
          type: string
          description: What was checked or done. Required.
          maxLength: 2000
      required:
      - note
    AdminAnalytics:
      type: object
      properties:
        range:
          $ref: '#/components/schemas/AnalyticsRange'
        filters_applied:
          $ref: '#/components/schemas/AnalyticsFilters'
        totals:
          $ref: '#/components/schemas/AnalyticsTotals'
        success_rate_percent:
          type: number
          format: double
          nullable: true
          description: Accepted quality decisions as a share of all decided ones; null when none.
        average_processing_time_ms:
          $ref: '#/components/schemas/AnalyticsTiming'
        top_rejection_reasons:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsCount'
          description: Each reason occurrence counts once.
        model_usage:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsCount'
          description: Each '+'-joined component of an algorithm string counts once per result.
        storage_bytes:
          $ref: '#/components/schemas/AnalyticsStorage'
        charts:
          $ref: '#/components/schemas/AnalyticsCharts'
        generated_at:
          type: string
          format: date-time
      required:
      - average_processing_time_ms
      - charts
      - filters_applied
      - generated_at
      - model_usage
      - range
      - storage_bytes
      - success_rate_percent
      - top_rejection_reasons
      - totals
    AdminEnhancementSummary:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        requested_level:
          type: string
        applied_level:
          type: string
        algorithm:
          type: string
          nullable: true
        identity_status:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
      required:
      - algorithm
      - applied_level
      - created_at
      - finished_at
      - id
      - identity_status
      - requested_level
      - status
    AdminFailedBatch:
      type: object
      description: A failed/stuck batch with its owner, for administrator visibility.
      properties:
        id:
          type: integer
          readOnly: true
        owner_id:
          type: integer
          readOnly: true
        owner_username:
          type: string
          readOnly: true
