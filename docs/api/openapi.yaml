        stage_order:
          type: array
          items:
            type: string
          description: 'The nine stages, in the order a photograph goes through them: ..., quality_analysis, enhancement,
            identity_grouping, finalizing, completed.'
        progress_percentage:
          type: number
          format: double
        cancellation_requested:
          type: boolean
        retry_count:
          type: integer
        counts:
          type: object
          additionalProperties:
            type: integer
        estimated_completion_at:
          type: string
          format: date-time
          nullable: true
        identity_grouping_finished:
          type: boolean
          description: Every photograph that will be grouped has been; a photograph still waiting for its enhancement is not.
        auto_enhance:
          type: boolean
        enhancement_finished:
          type: boolean
        suggested_merge_count:
          type: integer
        images:
          type: array
          items:
            type: object
            additionalProperties: {}
        updated_at:
          type: string
          format: date-time
          nullable: true
      required:
      - auto_enhance
      - batch_id
      - cancellation_requested
      - counts
      - enhancement_finished
      - estimated_completion_at
      - identity_grouping_finished
      - images
      - progress_percentage
      - retry_count
      - stage
      - stage_order
      - status
      - suggested_merge_count
      - updated_at
      - upload_type
