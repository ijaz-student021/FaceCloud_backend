    EnhancementLightingEnum:
      enum:
      - auto
      - dark
      - light
      type: string
      description: '* `auto` - Let the engine decide

        * `dark` - Dark photo

        * `light` - Light photo'
    EnhancementRequest:
      type: object
      properties:
        preset:
          allOf:
          - $ref: '#/components/schemas/PresetEnum'
          description: 'A name for a `level` + `style` pair, so a client can send one field: `auto` = level `auto` + style
            `natural`; `standard` = level `high` + style `natural`; `pro` = level `high` + style `ai_max`. It fills in whichever
            of `level` and `style` is not sent; a `level` or `style` that is sent wins over the preset''s value (`{"preset":
            "auto", "level": "high"}` is level `high` with style `natural`). Without a preset, `level` and `style` work exactly
            as before. The result''s `requested_level` and `requested_style` show the pair that was used, never the preset''s
            name. `pro` uses the `ai_max` style: see `style` about the identity check.


            * `auto` - Auto

            * `standard` - Standard

            * `pro` - Pro'
        level:
          allOf:
          - $ref: '#/components/schemas/EnhancementLevelEnum'
          default: auto
        style:
          allOf:
          - $ref: '#/components/schemas/EnhancementStyleEnum'
          default: natural
          description: 'No style skips the identity requirement for a face restoration. The adaptive engine (`ENHANCEMENT_RENDER_POLICY=adaptive_v1`)
            restores a face only when it can be compared with the upload and keeps the restored face only if it still matches,
            for `ai_max` too; when identity cannot be verified it skips the face restoration (the other steps still run) and
            says so in `identity_status` and `identity_notice`, and `identity_check_bypassed` stays false. Only the earlier
            staged pipeline (the other policies, when they run it) lets `ai_max` restore faces without a verified identity
            check; it reports that in `identity_check_bypassed` and `identity_notice`.


            * `natural` - Natural

            * `dynamic` - Dynamic

            * `ai_max` - AI Enhance'
        lighting:
          allOf:
          - $ref: '#/components/schemas/EnhancementLightingEnum'
          default: auto
          description: 'What the person says about the photograph''s lighting. `auto` (the default; what a request without
            the field means) lets the engine decide. `dark` runs the dark-photo method whatever the engine saw: the shadows
            are lifted first (a dark scene, a back-lit subject''s shadows, or the whole frame) and noise is then reduced.
            `light` runs the light-photo method: the brightness is kept and only detail, blur, size and polish are worked
            on. A forced method goes through every safety gate and limit an automatic one does: a lift that is not safe is
            refused, the photograph keeps what else passed, and the result''s `enhancement_summary` says so. The result''s
            `lighting` block reports `used` and `forced`. Only the adaptive engine (`ENHANCEMENT_RENDER_POLICY=adaptive_v1`)
            follows it.


            * `auto` - Let the engine decide

            * `dark` - Dark photo

            * `light` - Light photo'
