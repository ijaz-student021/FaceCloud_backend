components:
  schemas:
    AccessStateEnum:
      enum:
      - not_requested
      - pending
      - granted
      - denied
      - expired
      - revoked
      type: string
      description: '* `not_requested` - not_requested

        * `pending` - pending

        * `granted` - granted

        * `denied` - denied

        * `expired` - expired

        * `revoked` - revoked'
    AccountInvitation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/AccountInvitationRoleEnum'
        organization_id:
          type: integer
          writeOnly: true
          nullable: true
          description: 'Required for a moderator invitation: the organization the moderator will work for. Refused for any
            other role.'
        reason:
          type: string
          writeOnly: true
          description: 'Required (at least 8 characters) for a moderator invitation: why an administrator invites this moderator
            instead of the organization''s owner. Kept in the organization''s audit log.'
          maxLength: 500
        organization:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
          description: '{id, name} of the organization a moderator invitation is for; null otherwise.'
        status:
          type: string
          readOnly: true
        invited_by:
          type: string
          readOnly: true
          nullable: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        accepted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - accepted_at
      - created_at
      - email
      - expires_at
      - id
      - invited_by
      - organization
      - role
      - status
    AccountInvitationRoleEnum:
      enum:
      - user
      - moderator
      - admin
      type: string
      description: '* `user` - user

        * `moderator` - moderator

        * `admin` - admin'
    AccountTypeEnum:
      enum:
      - personal
      - organization
      type: string
    Acknowledge:
      type: object
      properties:
        note:
          type: string
          description: What was checked or done. Required.
          maxLength: 2000
      required:
      - note
    AddResult:
      type: object
      properties:
        added_ids:
          type: array
          items:
            type: integer
        already_in_album_ids:
          type: array
          items:
            type: integer
        not_found_ids:
          type: array
          items:
            type: integer
          description: 'Not yours, not a stored photograph, or does not exist: nothing was done for them.'
        photo_count:
          type: integer
      required:
      - added_ids
      - already_in_album_ids
      - not_found_ids
      - photo_count
    AdminAnalytics:
      type: object
      properties:
        range:
          $ref: '#/components/schemas/AnalyticsRange'
        filters_applied:
          $ref: '#/components/schemas/AnalyticsFilters'
        totals:
          $ref: '#/components/schemas/AnalyticsTotals'
        success_rate_percent:
          type: number
          format: double
          nullable: true
          description: Accepted quality decisions as a share of all decided ones; null when none.
        average_processing_time_ms:
          $ref: '#/components/schemas/AnalyticsTiming'
        top_rejection_reasons:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsCount'
          description: Each reason occurrence counts once.
        model_usage:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsCount'
          description: Each '+'-joined component of an algorithm string counts once per result.
        storage_bytes:
          $ref: '#/components/schemas/AnalyticsStorage'
        charts:
          $ref: '#/components/schemas/AnalyticsCharts'
        overview:
          $ref: '#/components/schemas/AnalyticsOverview'
        generated_at:
          type: string
          format: date-time
      required:
      - average_processing_time_ms
      - charts
      - filters_applied
      - generated_at
      - model_usage
      - overview
      - range
      - storage_bytes
      - success_rate_percent
      - top_rejection_reasons
      - totals
    AdminContactMessage:
      type: object
      description: 'What an administrator sees of a contact form message: everything the person filled in, and whether it
        has been read.'
      properties:
