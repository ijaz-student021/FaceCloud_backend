        A photograph goes through ``stage_order``: the automatic enhancement comes BEFORE the person folders. Each entry of
        ``images`` carries ``stage`` / ``status`` / ``progress_percentage``

        (the percentages only rise along ``stage_order``: enhancement 75, identity_grouping 95), ``identity_grouping`` (``{status,
