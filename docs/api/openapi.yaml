tags:
- name: auth
  description: Registration with email verification, login, token refresh, password reset, invitations.
- name: user
  description: The signed-in user's profile, avatar, sessions, dashboard and account deletion; administrator user management
    and invitations.
- name: images
  description: Uploading photographs (single, multiple, zip), upload batches and their progress, thumbnails, preprocessing,
    downloads of originals.
- name: enhancements
  description: Image enhancement jobs and results, the editor (sliders, previews, saved edit versions), model comparison and
    the optional AI advisor.
- name: validation
  description: Face and quality validation of an uploaded image.
- name: quality
  description: Image quality analysis results.
- name: identities
  description: Identity grouping of faces across photographs, review, merge, rename, exports and face search. Requires recorded
    biometric consent.
- name: duplicates
  description: Duplicate and near-duplicate detection between the user's photographs.
- name: reports
  description: Processing reports for images and batches, generated as downloadable files.
- name: downloads
  description: Zip packages of results, built in the background.
- name: events
  description: Photo events (grouped photographs).
- name: camera
  description: Camera sessions and snapshots the user chose to save.
- name: shares
  description: Revocable share links for a result; the public endpoints need no sign-in.
- name: notifications
  description: In-app notifications and their preferences.
- name: privacy
  description: Consents, data export, facial-data erasure and the user's own privacy audit.
- name: organizations
  description: Organizations, members, invitations, moderation queues, exports and reports. Access depends on the caller's
    role in the organization.
- name: contact
  description: The public contact form.
- name: system
  description: 'Administrator-only platform operations: health, queue, analytics, audit, security alerts, platform-wide images
    and failed jobs.'
