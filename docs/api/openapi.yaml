          $ref: '#/components/schemas/TriggerEnum'
        status:
          $ref: '#/components/schemas/ProcessingStatusEnum'
        enhancement_outcome:
          type: string
          nullable: true
          readOnly: true
          description: 'What the adaptive engine did: enhanced, partially_enhanced or original_preserved (the output is the
            original pixels); failed when the job failed. null for results made by the staged pipeline, which does not classify.'
        enhancement_summary:
          type: string
          readOnly: true
          description: One plain sentence on the outcome, safe to show a user.
        lighting:
          allOf:
          - $ref: '#/components/schemas/Lighting'
          nullable: true
          readOnly: true
          description: 'How the engine saw the lighting and which method it followed: {detected: dark|light, exposure, scene_median,
            brightened, used: dark|light, forced}. Show "Dark-photo method" for `used` dark and "Light-photo method" for light,
            and "chosen by you" when `forced` (the request''s `lighting`). Results made before the choice existed read forced
            false and used = detected. null for results made before this field existed or by the staged pipeline.'
        applied_stages:
          type: array
          items:
            $ref: '#/components/schemas/AppliedStage'
          readOnly: true
          description: 'The restoration and enhancement stages that changed the photograph, in order: stage (low_light, denoise,
            deblur, face_restore, upscale), engine, variant, and for upscale the scale, input_size and output_size ([width,
            height]). Empty when nothing changed.'
        skipped_stages:
          type: array
          items:
            $ref: '#/components/schemas/SkippedStage'
          readOnly: true
          description: 'Restoration stages the photograph called for that did not run: [{stage, reason}]. Empty when everything
            needed was done.'
        hd_unavailable_reason:
          type: string
          nullable: true
          readOnly: true
          description: A plain sentence when restoration was needed but could not be done (a model is switched off, not installed
            or its result was not safe to use); null otherwise. A barely changed photograph always has either applied_stages
            or this.
        processing_summary:
          allOf:
          - $ref: '#/components/schemas/ProcessingSummary'
          nullable: true
          readOnly: true
          description: 'Which engine produced each stage and whether AI restoration or a classical OpenCV fallback did the
            work: {ai_applied, classical_fallback, stages: [{stage, engine, kind (ai|classical|unknown), fallback, replaced}]}.
            ai_applied: a learned model produced at least one stage. classical_fallback: an OpenCV engine produced a stage
            in place of a learned model that was unavailable or refused. stages is empty when the original was kept. null
            for a failed job and for results made by the staged pipeline, which keeps no per-stage record.'
        identity_status:
          type: string
          nullable: true
          readOnly: true
          description: '`verified`: faces in the result were compared with the original and matched. `inconclusive`: no reliable
            comparison was possible. `unavailable`: no check ran (no consent, no identity model, or switched off). `failed`:
            compared and did not match. Null when nothing was enhanced, and for records made before this field existed.'
        identity_check_bypassed:
          type: boolean
          readOnly: true
          description: True when faces were generatively restored without a verified identity check. Only the earlier staged
            pipeline can do that (the AI Max style, or an operator setting that switches the requirement off); the adaptive
            engine never does, so this is false for its results. Show `identity_notice` to the user whenever it is not empty.
        identity_notice:
          type: string
          readOnly: true
          description: 'A sentence for the user when identity could not be verified or confirmed: the adaptive engine says
            that no face restoration was applied; the earlier staged pipeline says so when faces were restored without a verified
            check (the AI Max bypass). Empty when there is nothing to say.'
        output_name:
          type: string
          maxLength: 255
        output_format:
          type: string
          maxLength: 10
        output_width:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        output_height:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        output_file_size:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        processing_duration_ms:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        task_id:
          type: string
          maxLength: 255
        applied_parameters: {}
        failure_reason:
          type: string
        original_download_url:
          type: string
          readOnly: true
        standardized_download_url:
          type: string
          readOnly: true
        download_url:
          type: string
          nullable: true
          readOnly: true
        editor_url:
          type: string
          nullable: true
          readOnly: true
