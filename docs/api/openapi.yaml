                    id: 31
                    image: 12
                    status: completed
                    requested_level: auto
                    applied_level: low
                    requested_style: natural
                    enhancement_outcome: enhanced
                    enhancement_summary: 'Enhanced: brightened the dark subject.'
                    processing_summary:
                      ai_applied: true
                      classical_fallback: false
                      stages:
                      - stage: low_light
                        engine: retinexformer
                        kind: ai
                        fallback: false
                        replaced: []
                    identity_status: verified
