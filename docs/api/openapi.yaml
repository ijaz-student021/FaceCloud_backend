openapi: 3.0.3
info:
  title: FaceCloud API
  version: dev
  description: "FaceCloud AI: authenticated facial-image upload, enhancement, validation, identity grouping, reports, sharing\
    \ and downloads.\n\n## Quick start (the enhancement flow)\n\n1. `POST /api/auth/register/` then `POST /api/auth/verify-email/`\
    \ with the `registration_id` and `token` from the emailed link, then `POST /api/auth/login/`. Send the returned\n   `access`\
    \ token as `Authorization: Bearer <access>` on every other call (in Swagger UI, press the **Authorize** button and paste\
    \ the access token). Refresh it with `POST /api/auth/refresh/`.\n2. `POST /api/images/upload/single/` (multipart field\
    \ `file`). The response is an **upload batch**; the image is `images[0]`.\n3. `POST /api/enhancements/images/{image_id}/`\
    \ with `{\"level\": \"auto\", \"style\": \"natural\"}` (or one name for a pair: `{\"preset\": \"pro\"}`). Returns **202**\
    \ and a result with `status: \"queued\"`.\n4. Poll `GET /api/enhancements/results/{id}/` until `status` is `completed`\
    \ (or `failed`).\n   `enhancement_outcome` says what happened (`enhanced`, `partially_enhanced`, `original_preserved`,\
    \ `failed`) and `enhancement_summary` is one plain sentence safe to show a user.\n5. `GET /api/enhancements/results/{id}/download/`\
    \ returns the one final image.\n\n## Conventions\n\n* **Errors.** Validation errors (400) are `{\"field\": [\"message\"\
    ]}`; every other error is `{\"detail\": \"...\", \"code\": \"...\"}` (see the `ErrorDetail` schema).\n  401 means a missing,\
    \ expired or revoked token; 403 not allowed; 404 not found *or not yours* (other users' data is never revealed); 429 a\
    \ rate limit.\n* **Ownership.** Every call acts on the caller's own data unless the endpoint says it is for administrators\
    \ or organization roles.\n* **Pagination.** List endpoints return a plain array, or a paginated object when `page` or\
    \ `page_size` is passed.\n* **Asynchronous work.** Enhancement, reports, exports and packages are queued jobs: the POST\
    \ returns 202 and you poll the resource.\n* **Images.** Downloads stream through the API after an ownership check; there\
    \ are no public file URLs (shares use revocable tokens).\n* **Identity.** `identity_status` and `identity_verification.state`\
    \ say whether faces were compared with the upload. They never claim a guarantee.\n"
  contact:
    name: FaceCloud backend
paths:
  /api/albums/:
    get:
      operationId: albums_list
      parameters:
      - in: query
        name: image
        schema:
          type: integer
        description: Only the albums that contain this photograph (to show where a photo already is).
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Titles containing this text.
      tags:
      - albums
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlbumList'
          description: ''
        '401':
          description: Missing, expired, revoked or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: List my albums
      description: 'The caller''s albums, most recently changed first, each with `photo_count`, a cover and its thumbnail
        address. `q` filters by title; `image=<id>` lists only the albums that contain that photograph. Paginated.


        **Access:** any signed-in user, on their own data (another user''s data is a 404). **Rate limit:** `album` scope,
        1200/hour (429 when exceeded).'
    post:
      operationId: albums_create
      tags:
      - albums
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlbumWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlbumWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          description: Missing, expired, revoked or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Make an album
      description: 'A title (up to 120 characters), an optional description and optionally up to 200 `image_ids` to put in
        it. Returns the album with `added_ids` and `not_found_ids`. The number of albums per person is limited (`ALBUM_MAX_PER_USER`).


        **Access:** any signed-in user, on their own data (another user''s data is a 404). **Rate limit:** `album` scope,
        1200/hour (429 when exceeded).'
  /api/albums/{id}/:
    get:
      operationId: albums_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - albums
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
          description: ''
        '401':
          description: Missing, expired, revoked or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Get an album
      description: 'One album with its photograph count and cover. The photographs are `GET /api/albums/{id}/images/`.


        **Access:** any signed-in user, on their own data (another user''s data is a 404). **Rate limit:** `album` scope,
        1200/hour (429 when exceeded).'
    patch:
      operationId: albums_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - albums
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAlbumPatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAlbumPatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAlbumPatch'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          description: Missing, expired, revoked or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Rename or describe an album
      description: 'Send the fields that change: `title`, `description`.


        **Access:** any signed-in user, on their own data (another user''s data is a 404). **Rate limit:** `album` scope,
        1200/hour (429 when exceeded).'
    delete:
      operationId: albums_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - albums
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '401':
          description: Missing, expired, revoked or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Delete an album
      description: 'Deletes the album only; the photographs in it are never deleted.


        **Access:** any signed-in user, on their own data (another user''s data is a 404). **Rate limit:** `album` scope,
        1200/hour (429 when exceeded).'
  /api/albums/{id}/cover/:
    put:
      operationId: albums_cover_update
      description: '`image_id` must be a photograph that is in the album (a 400 otherwise).


        **Access:** any signed-in user, on their own data (another user''s data is a 404). **Rate limit:** `album` scope,
        1200/hour (429 when exceeded).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - albums
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CoverRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CoverRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          description: Missing, expired, revoked or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Choose an album's cover
    delete:
      operationId: albums_cover_destroy
      description: 'The cover becomes the first photograph added.


        **Access:** any signed-in user, on their own data (another user''s data is a 404). **Rate limit:** `album` scope,
        1200/hour (429 when exceeded).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - albums
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
          description: ''
        '401':
          description: Missing, expired, revoked or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Go back to the automatic cover
  /api/albums/{id}/images/:
    get:
      operationId: albums_images_list
      description: 'The same rows the gallery lists (status, thumbnail, favourite, ...), the most recently added first. Paginated
        (`page`, `page_size`).


        **Access:** any signed-in user, on their own data (another user''s data is a 404). **Rate limit:** `album` scope,
        1200/hour (429 when exceeded).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - albums
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyImage'
          description: ''
        '401':
          description: Missing, expired, revoked or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: List the photographs of an album
    post:
      operationId: albums_images_create
      description: 'Up to 200 `image_ids`. Idempotent: ones already in the album are listed in `already_in_album_ids`, ids
        that are not the caller''s photographs in `not_found_ids`. An album holds at most `ALBUM_MAX_IMAGES` photographs.


        **Access:** any signed-in user, on their own data (another user''s data is a 404). **Rate limit:** `album` scope,
        1200/hour (429 when exceeded).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - albums
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageIds'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImageIds'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageIds'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          description: Missing, expired, revoked or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Put photographs in an album
  /api/albums/{id}/images/remove/:
    post:
      operationId: albums_images_remove_create
      description: 'Up to 200 `image_ids`. Only removes them from this album; the photographs are not deleted. If one was
        the cover the cover goes back to automatic.


        **Access:** any signed-in user, on their own data (another user''s data is a 404). **Rate limit:** `album` scope,
        1200/hour (429 when exceeded).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - albums
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageIds'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImageIds'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageIds'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          description: Missing, expired, revoked or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Take photographs out of an album
  /api/auth/invitations/accept/:
    post:
      operationId: auth_invitations_accept_create
      description: 'Public: creates the invited account and signs in.


        **Access:** public, no token needed. **Rate limit:** `invitation` scope, 30/hour (429 when exceeded).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAccept'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationAccept'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationAccept'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Accept an invitation
  /api/auth/invitations/inspect/:
    post:
      operationId: auth_invitations_inspect_create
      description: 'Public: what an invitation token is for (role, email), so the sign-up form can show it.


        **Access:** public, no token needed. **Rate limit:** `invitation` scope, 30/hour (429 when exceeded).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationToken'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Inspect an invitation
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: 'Send exactly one of `identifier`, `username` or `email`, plus `password`. Returns `{refresh, access, user,
        role, dashboard}`. Repeated failures lock the account for a growing delay.


        **Access:** any signed-in user, on their own data (another user''s data is a 404).'
      summary: Log in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceCloudTokenObtainPair'
            examples:
              typical:
                summary: Typical request
                value:
                  identifier: amina@example.com
                  password: ForestRiver!4821
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FaceCloudTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FaceCloudTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                typical:
                  summary: Typical response
                  value:
                    refresh: <refresh token>
                    access: <access token>
                    role: user
                    user:
                      id: 7
                      username: amina
                      email: amina@example.com
                      role: user
                      is_email_verified: true
                    dashboard: user
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                WrongCredentials,Unverified,SuspendedOrInactiveAccount:
                  value:
                    detail:
                    - Invalid username/email or password.
                  summary: Wrong credentials, unverified, suspended or inactive account
          description: ''
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Request a password reset
      description: 'Sends a reset link to the address when it belongs to an account.


        **Access:** public, no token needed. **Rate limit:** `password_reset` scope, 10/hour (429 when exceeded).'
  /api/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Set a new password from a reset link
      description: 'Send `uidb64` and `token` from the emailed link and `new_password`. Existing tokens are revoked, so sign
        in again.


        **Access:** public, no token needed. **Rate limit:** `password_reset` scope, 10/hour (429 when exceeded).'
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: 'Takes the `refresh` token and returns a new `access` token (and a rotated `refresh` when rotation is on).
        Revoked or signed-out sessions are refused.


        **Access:** any signed-in user, on their own data (another user''s data is a 404).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceCloudTokenRefresh'
            examples:
              typical:
                summary: Typical request
                value:
                  refresh: <refresh token>
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FaceCloudTokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FaceCloudTokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceCloudTokenRefresh'
              examples:
                typical:
                  summary: Typical response
                  value:
                    access: <new access token>
                    refresh: <rotated refresh token>
          description: ''
        '429':
          description: Rate limit or per-user job limit reached; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Refresh the access token
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: 'Creates a *pending* registration and emails a verification link (`registration_id` and `token`). The account
        exists only after `POST /api/auth/verify-email/` succeeds. Returns 202 with `registration_id`, a masked email and
        the code lifetime. An active registration for the same username or email gives 400.


        **Access:** public, no token needed. **Rate limit:** `registration` scope, 10/hour (429 when exceeded).'
      summary: Start a registration
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
            examples:
              typical:
                summary: Typical request
                value:
                  full_name: Amina Khan
                  email: amina@example.com
                  password: ForestRiver!4821
                  password_confirm: ForestRiver!4821
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                typical:
                  summary: Typical response
                  value:
                    registration_id: 0b6f1c1e-6a4e-4b0e-9b6e-3f2a5d1c7e90
                    email: a***a@example.com
                    detail: A verification link has been sent to your email address.
                    expires_in_seconds: 900
                    resend_available_in_seconds: 60
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                EmailAlreadyUsed:
                  value:
                    email:
                    - A user with this email already exists.
                  summary: Email already used
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
