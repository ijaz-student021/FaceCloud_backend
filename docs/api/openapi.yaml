    GalleryAdjustment:
      type: object
      description: 'Manual control values: signed numbers, 0 neutral (``intensity``: 0-100, 100 neutral).


        Finite numbers only; booleans, NaN, infinity, out-of-range values and unknown

        control names are field errors. See ``GET /api/enhancements/editor/configuration/``

        for each control''s range, meaning and Pillow-factor mapping.'
      properties:
        brightness:
          type: number
          format: double
          maximum: 100.0
          minimum: -100.0
          default: 0.0
          description: Adds value * 0.35 to the LAB lightness L (0-255 scale) of every pixel. Range -100 to 100; neutral 0.
        contrast:
          type: number
          format: double
          maximum: 100.0
          minimum: -100.0
          default: 0.0
          description: Scales lightness around its median by 1 + value * 0.005. Range -100 to 100; neutral 0.
        shadows:
          type: number
          format: double
          maximum: 100.0
          minimum: -100.0
          default: 0.0
          description: 'Adds value * 0.45 to lightness, weighted by (1 - L/255)^2: it lifts or deepens the darkest tones.
            Range -100 to 100; neutral 0.'
        saturation:
          type: number
          format: double
          maximum: 100.0
          minimum: -100.0
          default: 0.0
          description: Scales the LAB colour channels a and b by 1 + value * 0.004. Range -100 to 100; neutral 0.
        highlights:
          type: number
          format: double
          maximum: 100.0
          minimum: -100.0
          default: 0.0
          description: 'Adds value * 0.40 to lightness, weighted by (L/255)^2: it recovers or pushes the brightest tones.
            Range -100 to 100; neutral 0.'
        warmth:
          type: number
          format: double
          maximum: 100.0
          minimum: -100.0
          default: 0.0
          description: Adds value * 0.30 to LAB b (positive is warmer, more yellow). Range -100 to 100; neutral 0.
        sharpness:
          type: number
          format: double
          maximum: 100.0
          minimum: -100.0
          default: 0.0
          description: 'Unsharp mask on lightness: L + (value / 100) * (L - blur(L)). Negative values soften. The blur radius
            is proportional to the image''s longer edge (sigma 0.68 px at 1024 px, never below 0.5 px), so a preview and a
            full-resolution save look alike. Range -100 to 100; neutral 0.'
        lowlight:
          type: number
          format: double
          maximum: 100.0
          minimum: 0.0
          default: 0.0
          description: 'Blends in a learned low-light result by value / 100: Retinexformer when it is switched on, otherwise
            Zero-DCE, otherwise an OpenCV gamma lift. Runs before every other control. 0 is off. Manual only: the local recipe
            and the advisor never set it. Range 0 to 100; neutral 0.'
        denoise:
          type: number
          format: double
          maximum: 100.0
          minimum: 0.0
          default: 0.0
          description: 'Blends in a denoised copy by value / 100: NAFNet-SIDD (real sensor noise) when it is switched on,
            otherwise an edge-preserving OpenCV bilateral filter. Runs after low light. 0 is off. Manual only. Range 0 to
            100; neutral 0.'
        deblur:
          type: number
          format: double
          maximum: 100.0
          minimum: 0.0
          default: 0.0
          description: 'Blends in a deblurred copy by value / 100: NAFNet-GoPro (motion blur) when it is switched on, otherwise
            an OpenCV unsharp mask. It cannot restore detail that was never captured. 0 is off. Manual only. Range 0 to 100;
            neutral 0.'
        face_restore:
          type: number
          format: double
          maximum: 100.0
          minimum: 0.0
          default: 0.0
          description: Blends in CodeFormer's restored faces by value / 100, only where a face is found. It invents plausible
            detail, so it is checked by the pipeline's identity gate when it runs there. Needs CodeFormer to be switched on;
            with no engine it is reported as not applied. 0 is off. Manual only. Range 0 to 100; neutral 0.
        intensity:
          type: number
          format: double
          maximum: 100.0
          minimum: 0.0
          default: 100.0
          description: 'Blends the result with the unenhanced (preprocessed) photo: 100 is the full result, 0 the unenhanced
            photo. Range 0 to 100; neutral 100.'
    GalleryEditRequest:
