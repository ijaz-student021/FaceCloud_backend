    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
    PatchedAdminOrganizationUpdate:
      type: object
      description: 'PATCH body for the administrator: any of name, plan, status, moderator_data_scope; ``reason`` is kept
        in the audit trail only.'
      properties:
        name:
          type: string
          maxLength: 150
        plan:
          $ref: '#/components/schemas/OrganizationPlanEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/AdminOrganizationUpdateStatusEnum'
          description: 'active or suspended. An organization waiting for its owner (`pending_owner`) becomes active only when
            the owner accepts the invitation.


            * `active` - Active

            * `suspended` - Suspended'
        moderator_data_scope:
          $ref: '#/components/schemas/ModeratorDataScopeEnum'
        download_approval_required:
          type: boolean
        download_grant_hours:
          type: integer
          maximum: 720
          minimum: 1
          nullable: true
        reason:
          type: string
          maxLength: 500
    PatchedAdminUserUpdate:
      type: object
      description: 'PATCH /api/user/admin/users/{id}/: the account''s fields plus, when making someone a moderator, the organization
        they will work for.'
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_ only.
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        role:
          $ref: '#/components/schemas/UserRoleEnum'
        is_email_verified:
          type: boolean
          readOnly: true
        is_suspended:
          type: boolean
        suspension_reason:
          type: string
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        uploads_count:
          type: integer
          readOnly: true
          description: Photos this account has uploaded (the list computes it for every row at once).
        account_type:
          allOf:
          - $ref: '#/components/schemas/AccountTypeEnum'
          description: '`personal`: only their own private workspace. `organization`: an active member of at least one shared
            organization (owner, moderator or member); they still have a private workspace too.'
          readOnly: true
        shared_organization_count:
          type: integer
          readOnly: true
          description: In how many shared organizations (not their own private workspace) the account is an active member.
        password_setup_pending:
          type: boolean
          readOnly: true
          description: 'True when the account has no usable password yet (created without one): the person must use the e-mailed
            setup link, or the administrator can resend it.'
        login_ready:
          type: boolean
          readOnly: true
          description: True only when nothing stops this person signing in right now (see `login_blockers`). An 'Active' account
            can still be not ready.
        login_blockers:
          type: array
          items:
            type: string
          readOnly: true
          description: 'Why the person cannot sign in yet: `inactive`, `suspended`, `email_unverified`, `password_setup_pending`,
            `no_active_moderator_membership` (a moderator without an active moderator membership in an active organization).'
        moderator_memberships:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
          description: 'The person''s moderator memberships in shared organizations, whatever their state: `{organization_id,
            organization_name, status, organization_status}`.'
        setup_email:
          type: object
          additionalProperties: {}
          readOnly: true
          description: 'The last account/setup e-mail attempt: `{status: sent|failed|none, at, kind}`. `sent` means the mail
