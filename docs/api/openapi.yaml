          type: string
          readOnly: true
          description: First and last name, or the username when no name is set.
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        display_name:
          type: string
          maxLength: 150
        organization_name:
          type: string
          description: Free text about the user. It grants no organization access.
          maxLength: 150
        job_title:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 32
        country:
          type: string
          maxLength: 80
        avatar_url:
          type: string
          nullable: true
          readOnly: true
          description: Authenticated URL of the user's own avatar (changes when it is replaced), or null.
      required:
      - avatar_url
      - date_joined
      - email
      - full_name
      - id
      - is_email_verified
      - role
      - username
    UserDashboard:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/DashboardSummary'
        uploads_last_7_days:
          type: array
          items:
            $ref: '#/components/schemas/DashboardDay'
          description: Seven rows, oldest first, zero-filled.
        recent_uploads:
          type: array
          items:
            $ref: '#/components/schemas/DashboardRecentUpload'
          description: Up to five, newest first.
        recent_activity:
          type: array
          items:
            $ref: '#/components/schemas/DashboardActivity'
          description: Newest first.
      required:
      - recent_activity
      - recent_uploads
      - summary
      - uploads_last_7_days
    UserNotification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventTypeEnum'
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/UserNotificationSeverityEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        message:
          type: string
          readOnly: true
        resource_type:
          type: string
          readOnly: true
        resource_id:
          type: integer
          readOnly: true
          nullable: true
        action_path:
          type: string
          readOnly: true
        metadata:
          readOnly: true
        is_read:
          type: boolean
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        email_status:
          allOf:
          - $ref: '#/components/schemas/UserNotificationEmailStatusEnum'
          readOnly: true
        email_sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action_path
      - created_at
      - email_sent_at
      - email_status
      - event_type
      - id
      - is_read
      - message
      - metadata
      - read_at
      - resource_id
      - resource_type
      - severity
      - title
    UserNotificationEmailStatusEnum:
      enum:
      - queued
      - sent
      - failed
      - skipped
      type: string
      description: '* `queued` - Queued

        * `sent` - Sent

        * `failed` - Failed

        * `skipped` - Skipped'
    UserNotificationSeverityEnum:
      enum:
      - info
      - success
      - warning
      - error
      type: string
      description: '* `info` - Information

        * `success` - Success

        * `warning` - Warning

        * `error` - Error'
    UserRoleEnum:
      enum:
      - user
      - moderator
      - admin
      type: string
      description: '* `user` - User

        * `moderator` - Moderator

        * `admin` - Admin'
    UserSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        device:
          type: string
          description: Parsed from the user agent, e.g. "Chrome on macOS".
        user_agent:
          type: string
        ip_address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: Last sign-in or token refresh.
        expires_at:
          type: string
          format: date-time
        is_current:
          type: boolean
          description: The session making this request.
      required:
      - created_at
      - device
      - expires_at
      - id
      - ip_address
      - is_current
      - last_seen_at
      - user_agent
    VerifyRegistration:
      type: object
      properties:
        registration_id:
          type: string
          format: uuid
        token:
          type: string
          maxLength: 256
      required:
      - registration_id
      - token
    WatermarkEnum:
      enum:
      - none
      - small
      - facecloud
      - username
      - custom
      type: string
      description: '* `none` - none

        * `small` - small

        * `facecloud` - facecloud

        * `username` - username

        * `custom` - custom'
    WatermarkPositionEnum:
      enum:
      - bottom_right
      - bottom_left
      - top_right
      - top_left
      - center
      - tile
      type: string
      description: '* `bottom_right` - bottom_right

        * `bottom_left` - bottom_left

        * `top_right` - top_right

        * `top_left` - top_left

        * `center` - center

        * `tile` - tile'
    ErrorDetail:
      type: object
      description: Error body used by every non-validation error.
      properties:
        detail:
          type: string
          description: Human-readable explanation.
        code:
          type: string
          description: Stable machine-readable code, present on some errors.
      required:
      - detail
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: Registration with email verification, login, token refresh, password reset, invitations.
- name: user
  description: The signed-in user's profile, avatar, sessions, dashboard and account deletion; administrator user management
    and invitations.
- name: images
  description: Uploading photographs (single, multiple, zip), upload batches and their progress, thumbnails, preprocessing,
    downloads of originals.
- name: enhancements
  description: Image enhancement jobs and results, the editor (sliders, previews, saved edit versions), model comparison and
    the optional AI advisor.
- name: memories
  description: 'A few of the best photographs of a moment, chosen for the person: on this day, an event, a person.'
- name: albums
  description: 'Albums the person makes by hand: a title, a cover and the photographs they put in.'
- name: validation
  description: Face and quality validation of an uploaded image.
- name: quality
  description: Image quality analysis results.
- name: identities
  description: Identity grouping of faces across photographs, review, merge, rename, exports and face search. Requires recorded
    biometric consent.
- name: duplicates
  description: Duplicate and near-duplicate detection between the user's photographs.
- name: reports
  description: Processing reports for images and batches, generated as downloadable files.
- name: downloads
  description: Zip packages of results, built in the background.
- name: events
  description: Photo events (grouped photographs).
- name: camera
  description: Camera sessions and snapshots the user chose to save.
- name: shares
  description: Revocable share links for a result; the public endpoints need no sign-in.
- name: notifications
  description: In-app notifications and their preferences.
- name: privacy
  description: Consents, data export, facial-data erasure and the user's own privacy audit.
- name: organizations
  description: Organizations, members, invitations, moderation queues, exports and reports. Access depends on the caller's
    role in the organization.
- name: contact
  description: The public contact form.
- name: search
  description: The top-bar search over the caller's own photographs, person folders and upload batches.
- name: system
  description: 'Administrator-only platform operations: health, queue, analytics, audit, security alerts, platform-wide images
    and failed jobs.'
