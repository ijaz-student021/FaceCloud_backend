# Local staging: PostgreSQL, Redis, Django (gunicorn), Celery worker, Celery Beat.
# Uses its own database and Redis volumes; it never touches a developer's
# db.sqlite3 or local Redis. See docs/deployment/local-staging.md.
#
#   cp .env.staging.example .env.staging   # then fill in the secrets
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up --build

x-app: &app
  build: {context: ., target: base}
  image: facecloud-backend:staging
  env_file: .env.staging
  environment:
    DB_ENGINE: django.db.backends.postgresql
    DB_HOST: db
    DB_PORT: "5432"
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    CACHE_URL: redis://redis:6379/2
    CELERY_TASK_ALWAYS_EAGER: "False"
    MEDIA_ROOT: /app/media
  volumes:
    - media:/app/media
    - ./.runtime/models:/app/.runtime/models:ro
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-facecloud_staging}
      POSTGRES_USER: ${DB_USER:-facecloud}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.staging}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: applies migrations to the staging database, then exits.
  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  web:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 10s
      retries: 12

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-Q", "celery", "--loglevel=info", "--concurrency=2"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
  redisdata:
  media:
